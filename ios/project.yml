name: VoltChat
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  VoltChat:
    type: application
    platform: iOS
    sources: [VoltChat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voltchat.mobile
        PRODUCT_NAME: VoltChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Volt Chat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
