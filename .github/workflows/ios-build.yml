name: Build Volt Chat iOS
on:
  push:
    branches: [ios-build]
    paths: ['ios/project.yml','ios/VoltChat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project VoltChat.xcodeproj -scheme VoltChat -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoltChat.app Payload/
          ditto -c -k --keepParent Payload VoltChat-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VoltChat-iOS-unsigned
          path: ios/VoltChat-unsigned.ipa
          if-no-files-found: error
